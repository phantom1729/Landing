<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Get Rakshak Elite Token</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --neon-blue: #00d2ff;
            --neon-pink: #ff0055;
        }
        body {
            font-family: 'Poppins', sans-serif; background: var(--bg-gradient); color: #fff;
            margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; box-sizing: border-box;
        }
        .portal-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); backdrop-filter: blur(12px);
            padding: 30px; border-radius: 20px; width: 100%; max-width: 400px; text-align: center; box-shadow: 0 15px 35px rgba(0,0,0,0.4);
        }
        h2 { font-family: 'Orbitron', sans-serif; color: var(--neon-blue); margin-bottom: 5px; letter-spacing: 1px; }
        .subtitle { font-size: 12px; color: #aaa; margin-bottom: 25px; }
        .form-group { text-align: left; margin-bottom: 15px; }
        label { font-size: 12px; color: var(--neon-blue); font-weight: 600; }
        .input-field {
            width: 100%; padding: 12px; margin-top: 5px; border-radius: 10px; border: 1px solid var(--glass-border);
            background: rgba(0,0,0,0.3); color: white; box-sizing: border-box; font-size: 14px;
        }
        .action-btn {
            width: 100%; padding: 14px; border-radius: 10px; border: none;
            background: linear-gradient(45deg, #00d2ff, #0066ff); color: white;
            font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.3s; margin-top: 10px;
        }
        #paymentArea { display: none; margin-top: 20px; padding-top: 20px; border-top: 1px solid var(--glass-border); }
        .token-display {
            background: rgba(255, 0, 85, 0.1); border: 1px dashed var(--neon-pink); padding: 12px;
            font-family: 'Orbitron', sans-serif; font-size: 18px; color: var(--neon-pink); font-weight: bold;
            border-radius: 8px; margin: 15px 0; letter-spacing: 2px; cursor: pointer;
        }
        .qr-placeholder { background: white; padding: 10px; width: 180px; height: 180px; margin: 15px auto; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
        .qr-placeholder img { width: 100%; height: 100%; }
        .instruction-text { font-size: 13px; color: #ddd; line-height: 1.5; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 8px; text-align: left; }
    </style>
</head>
<body>

    <div class="portal-card">
        <h2>RAKSHAK PORTAL</h2>
        <div class="subtitle">Get Lifetime Elite Access Token</div>

        <div id="registerForm">
            <div class="form-group">
                <label>YOUR NAME</label>
                <input type="text" id="userName" class="input-field" placeholder="Enter Full Name">
            </div>
            <div class="form-group">
                <label>MOBILE NUMBER</label>
                <input type="tel" id="userPhone" class="input-field" placeholder="Enter Mobile Number">
            </div>
            <button class="action-btn" onclick="requestToken()">GENERATE TOKEN</button>
        </div>

        <div id="paymentArea">
            <p style="font-size: 14px; margin: 0;">Your Activation Token Created:</p>
            <div class="token-display" id="tokenBox" onclick="copyToken()">RAKSH-XXXXX</div>
            <small style="color: #aaa; display:block; margin-top: -10px; margin-bottom: 15px;">(Tap token to copy)</small>

            <div class="instruction-text">
                👉 Scan the QR below to pay <b>₹49</b>.<br>
                ⚠️ <b>IMPORTANT:</b> Payment karte waqt Note/Message box mein yehi Token code likhna zaroori hai!
            </div>

            <div class="qr-placeholder" id="qrContainer"></div>
            <p style="font-size: 12px; color: #66ff66;"><i class="fas fa-sync fa-spin"></i> Token will activate automatically after admin verification.</p>
        </div>
    </div>

    <script>
        // Real Live Supabase Configuration Connected Directly
        const SB_URL = "https://fftlcppkmwwylpsefwss.supabase.co";
        const SB_KEY = "Sb_publishable_xBZzjfzK1gSpn9vQ8UlIng_bnahL7gW";
        const MY_UPI_ID = "YOUR_UPI_ID@okicici"; // <--- Yahan apni real UPI ID dalo

        function generateRandomToken() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
            let token = 'RAKSH-';
            for (let i = 0; i < 5; i++) {
                token += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return token;
        }

        async function requestToken() {
            const name = document.getElementById('userName').value.trim();
            const phone = document.getElementById('userPhone').value.trim();

            if(!name || !phone) {
                alert("Please fill all fields.");
                return;
            }

            const uniqueToken = generateRandomToken();

            try {
                const response = await fetch(`${SB_URL}/rest/v1/user_licenses`, {
                    method: 'POST',
                    headers: { 
                        "apikey": SB_KEY, 
                        "Authorization": `Bearer ${SB_KEY}`,
                        "Content-Type": "application/json",
                        "Prefer": "return=minimal"
                    },
                    body: JSON.stringify({ name, phone, token: uniqueToken, status: 'unused' })
                });

                if(response.ok) {
                    document.getElementById('registerForm').style.display = 'none';
                    document.getElementById('paymentArea').style.display = 'block';
                    document.getElementById('tokenBox').innerText = uniqueToken;

                    const upiString = `upi://pay?pa=${MY_UPI_ID}&pn=RakshakElite&am=49&cu=INR&tn=${uniqueToken}`;
                    const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(upiString)}`;
                    document.getElementById('qrContainer').innerHTML = `<img src="${qrUrl}">`;
                } else {
                    alert("Database injection failed.");
                }
            } catch (err) {
                alert("Network error. Please try again.");
            }
        }

        function copyToken() {
            const tokenText = document.getElementById('tokenBox').innerText;
            navigator.clipboard.writeText(tokenText);
            alert("Token copied: " + tokenText);
        }
    </script>
</body>
</html>
